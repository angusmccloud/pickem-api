service: pickem

frameworkVersion: "3"

plugins:
  - serverless-plugin-warmup

custom:
  warmup:
    default:
      enabled: true
      prewarm: true

params:
  default:
    stage: dev
    warmup: false
    userPoolId: us-east-1_Biu0dPvx6
    # nflpickgames.com is a DKIM-verified SES domain identity in us-east-1, so any local part
    # works here without a real mailbox behind it. This one is unmonitored by design -- the
    # email body says so, and Connor is CC'd on every reminder so replies have somewhere to go.
    reminderFromEmail: reminders@nflpickgames.com
    reminderFromName: PickEm Reminders
    reminderCcEmail: connort@gmail.com
  prod:
    stage: prod
    warmup: true
    userPoolId: us-east-1_Biu0dPvx6
    reminderFromEmail: reminders@nflpickgames.com
    reminderFromName: PickEm Reminders
    reminderCcEmail: connort@gmail.com
  dev:
    stage: dev
    warmup: false
    userPoolId: us-east-1_Biu0dPvx6
    reminderFromEmail: reminders@nflpickgames.com
    reminderFromName: PickEm Reminders
    reminderCcEmail: connort@gmail.com

provider:
  name: aws
  runtime: nodejs18.x
  stage: prod # Setting from ENV not working for some reason...
# stage: dev
  region: us-east-1
  environment:
    PARTICIPANTS_TABLE: ${self:service}-${param:stage}-participants
    GAMES_TABLE: ${self:service}-${param:stage}-games
    PICKS_TABLE: ${self:service}-${param:stage}-picks
    USER_POOL_ID: ${param:userPoolId}
    REMINDER_FROM_EMAIL: ${param:reminderFromEmail}
    REMINDER_FROM_NAME: ${param:reminderFromName}
    REMINDER_CC_EMAIL: ${param:reminderCcEmail}
    REMINDER_TIMEZONE: America/New_York
    SITE_URL: https://nflpickgames.com/

  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:DeleteItem
        - dynamodb:UpdateItem
        - dynamodb:GetItem
        - dynamodb:PutItem
        - cognito-idp:ListUsers
        - lambda:InvokeFunction
        - ses:SendEmail
        - ses:SendRawEmail
        - "sqs:SendMessage"
        - "sqs:GetQueueUrl"
      Resource: "*"

functions:
  testerFunction:
    handler: app/private/tester.tester
    description: Used for testing functions
    # Not frontend-facing, so a cold start is fine. Warmup also meant every uncommented line in
    # tester.js ran every 5 minutes in prod.
    warmup:
      default:
        enabled: false
  sendPickReminders:
    handler: app/private/reminders.sendPickReminders
    description: Email participants who are missing picks for games today or tomorrow
    timeout: 300
    # custom.warmup.default.enabled is true, which opts in every function unless it says otherwise.
    # This one must stay out: a warmup ping during the 10am hour would send real emails.
    warmup:
      default:
        enabled: false
    # Two schedules so one always lands on 10am ET across the DST change. The handler exits
    # immediately on whichever invoke isn't 10am local, so only one does work per day.
    events:
      - schedule:
          rate: cron(0 14 * * ? *)
          description: Pick reminders - 10am EDT
      - schedule:
          rate: cron(0 15 * * ? *)
          description: Pick reminders - 10am EST
  getStandings:
    warmup:
      default:
        enabled: ${param:warmup}
    handler: app/public/standings.getStandings
    description: Regular Season Standings
    events:
      - http:
          path: standings
          method: get
          cors:
              origin: '*'
              headers:
                - Content-Type
                - X-Amz-Date
                - Authorization
                - X-Api-Key
                - X-Amz-Security-Token
                - jwtheader
              allowCredentials: true
  getStandingsByWeek:
    warmup:
      default:
        enabled: ${param:warmup}
    handler: app/public/standings.getStandingsByWeek
    description: Standings by Week
    events:
      - http:
          path: standings/{weekNumber}
          method: get
          cors:
              origin: '*'
              headers:
                - Content-Type
                - X-Amz-Date
                - Authorization
                - X-Api-Key
                - X-Amz-Security-Token
                - jwtheader
              allowCredentials: true
  getPicksOneWeekAllPlayers:
    warmup:
      default:
        enabled: ${param:warmup}
    handler: app/public/picks.getPicksByWeek
    description: All Players Picks, One Week
    events:
      - http:
          path: picks/all/{weekNumber}
          method: get
          cors:
              origin: '*'
              headers:
                - Content-Type
                - X-Amz-Date
                - Authorization
                - X-Api-Key
                - X-Amz-Security-Token
                - jwtheader
              allowCredentials: true
  getPicksOneWeekOnePlayer:
    warmup:
      default:
        enabled: ${param:warmup}
    handler: app/public/picks.getPicksByWeekByPlayer
    description: One Player Picks, One Week
    events:
      - http:
          path: picks/{weekNumber}
          method: get
          cors:
              origin: '*'
              headers:
                - Content-Type
                - X-Amz-Date
                - Authorization
                - X-Api-Key
                - X-Amz-Security-Token
                - jwtheader
              allowCredentials: true
  getPicksAllWeeksOnePlayer:
    warmup:
      default:
        enabled: ${param:warmup}
    handler: app/public/picks.getPicksByPlayer
    description: One Player Picks, All Weeks
    events:
      - http:
          path: picks
          method: get
          cors:
              origin: '*'
              headers:
                - Content-Type
                - X-Amz-Date
                - Authorization
                - X-Api-Key
                - X-Amz-Security-Token
                - jwtheader
              allowCredentials: true
  setPick:
    warmup:
      default:
        enabled: ${param:warmup}
    handler: app/public/picks.updatePick
    description: Set pick for one week
    events:
      - http:
          path: picks
          method: put
          cors:
              origin: '*'
              headers:
                - Content-Type
                - X-Amz-Date
                - Authorization
                - X-Api-Key
                - X-Amz-Security-Token
                - jwtheader
              allowCredentials: true
  createGame:
    warmup:
      default:
        enabled: ${param:warmup}
    handler: app/public/games.createGame
    description: Create Game
    events:
      - http:
          path: games/create
          method: post
          cors:
              origin: '*'
              headers:
                - Content-Type
                - X-Amz-Date
                - Authorization
                - X-Api-Key
                - X-Amz-Security-Token
                - jwtheader
              allowCredentials: true
  getGamesByWeek:
    warmup:
      default:
        enabled: ${param:warmup}
    handler: app/public/games.getGamesByWeek
    description: List the Number of Games per Week
    events:
      - http:
          path: games
          method: get
          cors:
              origin: '*'
              headers:
                - Content-Type
                - X-Amz-Date
                - Authorization
                - X-Api-Key
                - X-Amz-Security-Token
                - jwtheader
              allowCredentials: true
  updateGame:
    warmup:
      default:
        enabled: ${param:warmup}
    handler: app/public/games.updateGame
    description: Update Game
    events:
      - http:
          path: games/update/{gameId}
          method: put
          cors:
              origin: '*'
              headers:
                - Content-Type
                - X-Amz-Date
                - Authorization
                - X-Api-Key
                - X-Amz-Security-Token
                - jwtheader
              allowCredentials: true
  setWinner:
    warmup:
      default:
        enabled: ${param:warmup}
    handler: app/public/games.setWinner
    description: Set Game Winner
    events:
      - http:
          path: games/set-winner/{gameId}
          method: put
          cors:
              origin: '*'
              headers:
                - Content-Type
                - X-Amz-Date
                - Authorization
                - X-Api-Key
                - X-Amz-Security-Token
                - jwtheader
              allowCredentials: true
  getPayoutStructure:
    warmup:
      default:
        enabled: ${param:warmup}
    handler: app/public/rules.getPayoutStructure
    description: Get Payout Structure
    events:
      - http:
          path: rules/payout-structure
          method: get
          cors:
              origin: '*'
              headers:
                - Content-Type
                - X-Amz-Date
                - Authorization
                - X-Api-Key
                - X-Amz-Security-Token
                - jwtheader
              allowCredentials: true
  getCurrentParticipantStatus:
    warmup:
      default:
        enabled: ${param:warmup}
    handler: app/public/users.getSingleParticipant
    description: Get Info on Current Participant
    events:
      - http:
          path: user
          method: get
          cors:
              origin: '*'
              headers:
                - Content-Type
                - X-Amz-Date
                - Authorization
                - X-Api-Key
                - X-Amz-Security-Token
                - jwtheader
              allowCredentials: true
  getAllParticipants:
    warmup:
      default:
        enabled: ${param:warmup}
    handler: app/public/users.getAllParticipants
    description: Get All Participants
    events:
      - http:
          path: user/all
          method: get
          cors:
              origin: '*'
              headers:
                - Content-Type
                - X-Amz-Date
                - Authorization
                - X-Api-Key
                - X-Amz-Security-Token
                - jwtheader
              allowCredentials: true
  updateParticipant:
    warmup:
      default:
        enabled: ${param:warmup}
    handler: app/public/users.updateParticipant
    description: Update a Participant
    events:
      - http:
          path: user/{userId}
          method: put
          cors:
              origin: '*'
              headers:
                - Content-Type
                - X-Amz-Date
                - Authorization
                - X-Api-Key
                - X-Amz-Security-Token
                - jwtheader
              allowCredentials: true
          
resources:
  Resources:
    ParticipantsDynamoDbTable:
      Type: 'AWS::DynamoDB::Table'
      DeletionPolicy: Retain
      Properties:
        AttributeDefinitions:
          -
            AttributeName: "participantId"
            AttributeType: "S"
        KeySchema:
          -
            AttributeName: "participantId"
            KeyType: "HASH"
        BillingMode: PAY_PER_REQUEST
        StreamSpecification:
          StreamViewType: "NEW_AND_OLD_IMAGES"
        TableName: ${self:provider.environment.PARTICIPANTS_TABLE}
    GamesDynamoDbTable:
      Type: 'AWS::DynamoDB::Table'
      DeletionPolicy: Retain
      Properties:
        AttributeDefinitions:
          -
            AttributeName: "gameId"
            AttributeType: "S"
        KeySchema:
          -
            AttributeName: "gameId"
            KeyType: "HASH"
        BillingMode: PAY_PER_REQUEST
        StreamSpecification:
          StreamViewType: "NEW_AND_OLD_IMAGES"
        TableName: ${self:provider.environment.GAMES_TABLE}
    PicksDynamoDbTable:
      Type: 'AWS::DynamoDB::Table'
      DeletionPolicy: Retain
      Properties:
        AttributeDefinitions:
          -
            AttributeName: "pickId"
            AttributeType: "S"
        KeySchema:
          -
            AttributeName: "pickId"
            KeyType: "HASH"
        BillingMode: PAY_PER_REQUEST
        StreamSpecification:
          StreamViewType: "NEW_AND_OLD_IMAGES"
        TableName: ${self:provider.environment.PICKS_TABLE}